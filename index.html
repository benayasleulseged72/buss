<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>benayas leuseged software community login page</title>
<link rel="stylesheet" href="style.css">

<style>
h2{font-size:2em;color:#0ef;text-align:center;margin-bottom:10px}
.clinic-subtitle{text-align:center;color:#0ef;font-size:0.9em;margin-bottom:30px;opacity:0.8;letter-spacing:2px}
.error{color:#ff006e;text-align:center;margin-top:15px;font-weight:600;display:none;animation:shake 0.5s ease}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
</style>

</head>
<body>

<img src="1.png" alt="logo" width="83" style="margin-bottom:20px">

<div class="container">
<div class="login-box">
<h2>Benayas Leulseged</h2>
<p class="clinic-subtitle">Software Community</p>

<form onsubmit="handleLogin(event)">
<div class="input-box">
<input type="text" id="username" required autocomplete="off">
<label>Username</label>
</div>

<div class="input-box">
<input type="password" id="password" required>
<label>Password</label>
</div>

<!-- FIXED BUTTON -->
<button type="submit" class="btn">
  Access System
  <span class="shine"></span>
</button>

<p class="error" id="error">Invalid credentials. Access denied.</p>
</form>
</div>

<!-- 50 spans -->
<script>
for(let i=0;i<50;i++){
  document.write(`<span style="--i:${i}"></span>`);
}
</script>

</div>

<script>
  
const users={
  ben:'admin.html',nr1:'nr1.html',nr2:'nr2.html',
  doc1:'doc1.html',doc2:'doc2.html',doc3:'doc3.html',
  lab:'lab.html',admin:'admin.html',admpr:'admpr.html'
};

function handleLogin(e){
  e.preventDefault();
  const username=document.getElementById('username').value;
  const password=document.getElementById('password').value;

  if(users[username] && username===password){
    localStorage.setItem('currentUser',username);
    window.location.href=users[username];
  } else {
    const error=document.getElementById('error');
    error.style.display='block';
    setTimeout(()=>error.style.display='none',3000);
  }
}

</script>

</body>
</html>
